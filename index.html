<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">🎙️</div>
        <h1>Speech to Text</h1>
        <p>Convert your voice into text instantly</p>
    </div>

    <div class="card">

        <div id="status">Ready to listen</div>

        <button id="startBtn" onclick="startListening()">
            🎤 Start Speaking
        </button>

        <button id="stopBtn" onclick="stopListening()">
            ⏹ Stop
        </button>

        <textarea id="result"
            placeholder="Your speech will appear here..."
            readonly></textarea>

        <div class="buttons">
            <button onclick="copyText()">📋 Copy</button>
            <button onclick="clearText()">🗑️ Clear</button>
        </div>

    </div>

    <div class="info">
        <h3>How it works</h3>
        <p>🎤 Click Start Speaking</p>
        <p>🗣️ Speak clearly</p>
        <p>📝 Your speech appears as text</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
